</defs><style>text{font-family:"Instrument Sans",system-ui,sans-serif}</style>

<text x="40" y="62" fill="#5b6472" font-size="13" text-anchor="start" letter-spacing="1.6">1 · QUEM CHAMA</text>
<rect x="40" y="90" width="280" height="110" rx="10" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="2"/>
<text x="180" y="126" fill="#1e1e1e" font-size="20" font-weight="600" text-anchor="middle">Teste manual</text>
<text x="180" y="149" fill="#5b6472" font-size="15" text-anchor="middle">curl · Postman</text>
<text x="180" y="170" fill="#5b6472" font-size="15" text-anchor="middle">MCP Inspector</text>
<rect x="40" y="250" width="280" height="130" rx="10" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="2"/>
<text x="180" y="286" fill="#1e1e1e" font-size="20" font-weight="600" text-anchor="middle">make eval</text>
<text x="180" y="309" fill="#5b6472" font-size="15" text-anchor="middle">10 conversas × 3 repetições</text>
<text x="180" y="330" fill="#5b6472" font-size="15" text-anchor="middle">2 turnos cada</text>
<text x="180" y="351" fill="#5b6472" font-size="15" text-anchor="middle">reseta o banco a cada conversa</text>

<text x="360" y="62" fill="#c2410c" font-size="13" text-anchor="start" letter-spacing="1.6">2 · SOLUÇÃO DO CANDIDATO</text>
<rect x="360" y="70" width="820" height="700" rx="14" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="8 6"/>
<text x="770" y="795" fill="#5b6472" font-size="15" text-anchor="middle">recebe POST /chat com X-Account-Id, thread_id e message</text>
<text x="770" y="816" fill="#5b6472" font-size="15" text-anchor="middle">e responde { "reply": "..." }</text>

<text x="1240" y="62" fill="#0f766e" font-size="13" text-anchor="start" letter-spacing="1.6">3 · AMBIENTE DO DESAFIO</text>
<rect x="1240" y="90" width="380" height="190" rx="10" fill="#d5efec" stroke="#0f766e" stroke-width="2"/>
