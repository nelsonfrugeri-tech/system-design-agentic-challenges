<text x="1430" y="180" fill="#1e1e1e" font-size="15" font-weight="600" text-anchor="middle">consultas</text>
<text x="1430" y="201" fill="#5b6472" font-size="14" text-anchor="middle">get_balance · list_bills</text>
<text x="1430" y="220" fill="#5b6472" font-size="14" text-anchor="middle">list_investments · list_operations</text>
<text x="1430" y="245" fill="#1e1e1e" font-size="15" font-weight="600" text-anchor="middle">movimentos</text>
<text x="1430" y="266" fill="#5b6472" font-size="14" text-anchor="middle">redeem_investment · pay_card_bill</text>
