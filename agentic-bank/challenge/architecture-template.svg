<text x="1070" y="1011" fill="#5b6472" font-size="15" text-anchor="middle">acertos e motivo da falha</text>
<rect x="1300" y="910" width="380" height="140" rx="10" fill="#d5efec" stroke="#0f766e" stroke-width="2"/>
