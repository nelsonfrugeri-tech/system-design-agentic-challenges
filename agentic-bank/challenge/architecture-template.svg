<text x="230" y="1011" fill="#5b6472" font-size="15" text-anchor="middle">final_state → passed</text>
<rect x="460" y="910" width="380" height="140" rx="10" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="2"/>
<text x="650" y="946" fill="#1e1e1e" font-size="20" font-weight="600" text-anchor="middle">LLM-as-judge</text>
<text x="650" y="969" fill="#5b6472" font-size="15" text-anchor="middle">OpenRouter</text>
<text x="650" y="990" fill="#5b6472" font-size="15" text-anchor="middle">deepseek-v4-flash-0731</text>
<text x="650" y="1011" fill="#5b6472" font-size="15" text-anchor="middle">critérios do dataset → nota</text>
<rect x="880" y="910" width="380" height="140" rx="10" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="2"/>
