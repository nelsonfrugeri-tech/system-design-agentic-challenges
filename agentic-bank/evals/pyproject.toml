[project]
name = "agentic-bank-evals"
version = "0.1.0"
description = "Evals harness: judges an Aurora Bank assistant from the bank state."
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28,<1",
  "langfuse>=4,<5",
  "mcp>=1,<2",
  "opentelemetry-api>=1.44,<2",
  "pydantic>=2,<3",
  "starlette>=1,<2",
  "uvicorn>=0.53,<1",
]

[dependency-groups]
dev = [
  "black>=26,<27",
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "ruff>=0.15,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["e2e: whole rounds; calibrate with make eval name=<name> type=stub"]
addopts = "-m 'not e2e'"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
files = ["harness", "baselines", "tests"]
strict = true
