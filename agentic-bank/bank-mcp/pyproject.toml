[project]
name = "bank-mcp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp>=1,<2",
  "pydantic>=2,<3",
]

[dependency-groups]
dev = [
  "black>=26,<27",
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "ruff>=0.15,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
files = ["bank", "tests"]
strict = true
